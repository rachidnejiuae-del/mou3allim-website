<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mou3allim — تحدي الإنجليزية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');
  :root{
    --teal:#0E7C66;--teal-d:#0A5D4C;--teal-l:#E3F3EB;
    --amber:#F2A63B;--amber-d:#D07E12;
    --coral:#F26D5B;--purple:#8B6DD6;--blue:#3F8FD6;--pink:#EC6A9C;
    --ink:#1E2E29;--muted:#728A82;--card:#FFFFFF;--line:#EAE5DA;
    --good:#1FA872;--bad:#EC5A44;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#EAF0F6;min-height:100%;overflow-x:hidden;position:relative;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.5;animation:float 14s ease-in-out infinite;}
  .blob.b1{width:280px;height:280px;background:#BcD8F2;top:-60px;left:-70px;}
  .blob.b2{width:240px;height:240px;background:#FBE2B8;bottom:-50px;right:-60px;animation-delay:-4s;}
  .blob.b3{width:200px;height:200px;background:#D8CBF2;top:40%;right:-70px;animation-delay:-8s;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(20px,-24px) scale(1.08);}}

  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;display:flex;flex-direction:column;}
  .brand{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 16px;font-weight:800;font-size:19px;color:var(--teal-d);}
  .brand .m{width:32px;height:32px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 4px 10px rgba(14,124,102,.3);}
  #muteBtn{position:absolute;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:19px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.05);}
  #muteBtn:active{transform:scale(.92);}
  .card{background:var(--card);border-radius:26px;box-shadow:0 14px 40px rgba(30,50,80,.12),0 2px 6px rgba(30,50,80,.05);}

  /* HOME */
  .home{padding:26px 22px;text-align:center;}
  .mascot{font-size:60px;line-height:1;margin-bottom:6px;animation:bounce 2s ease-in-out infinite;display:inline-block;}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}
  .home h1{font-size:31px;font-weight:800;line-height:1.05;margin-bottom:4px;}
  .home h1 .em{color:var(--blue);}
  .home p{color:var(--muted);font-size:15px;margin-bottom:22px;font-weight:500;}
  .themes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .theme{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
    background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:18px 10px;transition:.15s;font-family:inherit;}
  .theme:active{transform:scale(.96);}
  .theme:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,50,80,.12);border-color:var(--blue);}
  .theme .ico{font-size:38px;line-height:1;}
  .theme .t{font-weight:800;font-size:15px;}
  .theme .c{font-size:11.5px;color:var(--muted);font-weight:500;}
  .theme.all{grid-column:span 2;flex-direction:row;justify-content:center;gap:10px;background:var(--amber);border-color:var(--amber);color:#fff;}
  .theme.all .t,.theme.all .c{color:#fff;}
  .theme.all:hover{border-color:var(--amber-d);}

  /* PLAY */
  .play{padding:20px;display:none;}
  .hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .hud .pill{background:var(--teal-l);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;}
  .hud .pill.streak{background:#FDECD0;color:var(--amber-d);}
  .progbar{height:10px;background:#EEF2F0;border-radius:999px;overflow:hidden;margin:10px 0 16px;}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--amber));border-radius:999px;transition:width .35s;}

  .prompt{background:linear-gradient(135deg,#F5F9FD,#EEF4FB);border-radius:20px;padding:24px 14px;text-align:center;border:2px solid #E1ECF7;margin-bottom:16px;}
  .prompt .emoji{font-size:64px;line-height:1;margin-bottom:6px;}
  .prompt .fr{font-size:26px;font-weight:800;color:var(--ink);}
  .prompt .ask{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;}

  .choices{display:grid;gap:12px;}
  .choice{border:2.5px solid var(--line);border-radius:18px;background:#fff;padding:16px;font-family:inherit;
    font-weight:700;font-size:20px;cursor:pointer;transition:.12s;color:var(--ink);box-shadow:0 4px 0 var(--line);}
  .choice:active{transform:translateY(4px);box-shadow:0 0 0 var(--line);}
  .choice:hover:not(.locked){border-color:var(--blue);}
  .choice.correct{background:#E4F7EE;border-color:var(--good);color:var(--good);box-shadow:0 4px 0 #B7E6CF;}
  .choice.wrong{background:#FDEBE7;border-color:var(--bad);color:var(--bad);box-shadow:0 4px 0 #F5C9C0;animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  .feedback{text-align:center;height:26px;font-weight:700;font-size:16px;margin-top:14px;}
  .feedback.good{color:var(--good);} .feedback.bad{color:var(--bad);}

  /* RESULT */
  .result{padding:28px 22px;text-align:center;display:none;}
  .result .big{font-size:70px;margin-bottom:4px;animation:pop .5s;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.2);}100%{transform:scale(1);}}
  .result h2{font-size:28px;margin-bottom:2px;}
  .result .score{font-size:15px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .stars{font-size:38px;letter-spacing:8px;margin:8px 0 18px;color:var(--amber);}
  .result .msg{background:#EAF0F6;color:var(--blue);border-radius:16px;padding:13px;font-size:14.5px;font-weight:600;margin-bottom:18px;}
  .btnrow{display:flex;gap:11px;}
  .btn{flex:1;border:none;border-radius:18px;padding:16px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;transition:.1s;}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-d);}
  .btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-d);}
  .btn-ghost{background:#EEF2F0;color:var(--ink);box-shadow:0 5px 0 #DBE3DF;}
  .btn-ghost:active{transform:translateY(4px);box-shadow:0 1px 0 #DBE3DF;}
  .back{background:none;border:none;color:var(--muted);font-family:inherit;font-size:22px;cursor:pointer;padding:4px 8px;font-weight:700;}

  .foot{text-align:center;margin-top:auto;padding-top:22px;color:var(--muted);font-size:12.5px;font-weight:500;}
  .foot a{color:var(--teal-d);font-weight:700;text-decoration:none;}
  .burst{position:fixed;pointer-events:none;font-size:24px;animation:fly 1s ease-out forwards;z-index:60;}
  @keyframes fly{0%{opacity:1;transform:translateY(0) scale(.6) rotate(0);}100%{opacity:0;transform:translateY(-110px) scale(1.5) rotate(30deg);}}
</style>
</head>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="wrap">
  <div class="brand"><span class="m">M</span> تحدي الإنجليزية
    <button id="muteBtn" title="Son">🔊</button>

  <!-- HOME -->
  <div class="card home" id="home">

    <p>اختر موضوعاً وابحث عن الكلمات الصحيحة 🎯</p>
    <button id="enableSound" style="width:100%;margin-bottom:14px;background:#FDECD0;color:#D07E12;border:2px solid #F2A63B;border-radius:16px;padding:12px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;">🔊 تشغيل الصوت</button>
    <div class="themes" id="themes"></div>
    <div class="foot">

  <!-- PLAY -->
  <div class="card play" id="play">

      <div class="pill">⭐ <span id="scoreVal">0</span></div>

    <div class="progbar"><div class="progfill" id="progfill"></div></div>
    <div class="prompt">
      <div class="emoji" id="pEmoji">🐶</div>
      <div class="fr" id="pFr">chien</div>

    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- RESULT -->
  <div class="card result" id="result">
    <div class="big" id="resEmoji">🏆</div>
    <h2 id="resTitle">Bravo !</h2>
    <div class="score" id="resScore"></div>
    <div class="stars" id="resStars"></div>
    <div class="msg" id="resMsg"></div>
    <div class="btnrow">
      <button class="btn btn-ghost" id="resHome">القائمة</button>
      <button class="btn btn-primary" id="resAgain">إعادة 🔄</button>
    </div>
    <div class="foot" style="margin-top:20px;">
      تريد التحدّث بالإنجليزية جيداً ؟<br>
      <a href="https://mou3allim.com" target="_blank">جد أستاذاً على mou3allim.com →</a>
    </div>
  </div>
</div>

    numbers:{name:'الأرقام',icon:'🔢',words:[
      ['واحد','one','1️⃣'],['اثنان','two','2️⃣'],['ثلاثة','three','3️⃣'],['أربعة','four','4️⃣'],
      ['خمسة','five','5️⃣'],['ستة','six','6️⃣'],['سبعة','seven','7️⃣'],['ثمانية','eight','8️⃣'],
      ['تسعة','nine','9️⃣'],['عشرة','ten','🔟'],
    ]},
    body:{name:'الجسم',icon:'✋',words:[
      ['يد','hand','✋'],['قدم','foot','🦶'],['عين','eye','👁️'],['أذن','ear','👂'],
      ['أنف','nose','👃'],['فم','mouth','👄'],['سنّ','tooth','🦷'],['شعر','hair','💇'],
      ['ذراع','arm','💪'],['قلب','heart','❤️'],
    ]},
    home:{name:'البيت',icon:'🏠',words:[
      ['بيت','house','🏠'],['باب','door','🚪'],['نافذة','window','🪟'],['سرير','bed','🛏️'],
      ['كرسي','chair','🪑'],['طاولة','table','🍽️'],['مفتاح','key','🔑'],['كتاب','book','📖'],
      ['ساعة','clock','🕐'],['مصباح','lamp','💡'],
    ]},
  };

  // ---------- state ----------
  const screens={home:document.getElementById('home'),play:document.getElementById('play'),result:document.getElementById('result')};
  function show(name){Object.values(screens).forEach(s=>s.style.display='none');screens[name].style.display='block';}
  let pool=[], qList=[], qIndex=0, totalQ=10, score=0, streak=0, bestStreak=0, locked=false, currentTheme='';

  // build theme buttons
  const themesEl=document.getElementById('themes');
  Object.entries(THEMES).forEach(([key,th])=>{
    const b=document.createElement('button');b.className='theme';
    b.innerHTML=`<span class="ico">${th.icon}</span><span class="t">${th.name}</span><span class="c">${th.words.length} كلمة</span>`;
    b.addEventListener('click',()=>startTheme(key));themesEl.appendChild(b);
  });
  const allBtn=document.createElement('button');allBtn.className='theme all';
  allBtn.innerHTML=`<span class="ico" style="font-size:26px;">🎲</span><span><span class="t">الكل مختلط</span><span class="c" style="display:block;">جميع المواضيع</span></span>`;
  allBtn.addEventListener('click',()=>startTheme('all'));themesEl.appendChild(allBtn);

  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  function startTheme(key){
    currentTheme=key;
    if(key==='all'){ pool=[]; Object.values(THEMES).forEach(th=>pool.push(...th.words)); }
    else pool=[...THEMES[key].words];
    qList=shuffle([...pool]).slice(0, Math.min(10, pool.length));
    totalQ=qList.length; qIndex=0; score=0; streak=0; bestStreak=0;
    document.getElementById('scoreVal').textContent=0;
    document.getElementById('streakVal').textContent=0;
    show('play'); renderQuestion();
  }

  function renderQuestion(){
    locked=false;
    const [fr,en,emoji]=qList[qIndex];
    document.getElementById('pEmoji').textContent=emoji;
    document.getElementById('pFr').textContent=fr;
    document.getElementById('feedback').textContent='';
    document.getElementById('progfill').style.width=((qIndex)/totalQ*100)+'%';
    // build 4 choices: correct + 3 distractors from the pool
    const distractors=shuffle(pool.filter(w=>w[1]!==en)).slice(0,3).map(w=>w[1]);
    const options=shuffle([en,...distractors]);
    const box=document.getElementById('choices');box.innerHTML='';
    options.forEach(opt=>{
      const b=document.createElement('button');b.className='choice';b.textContent=opt;
      b.addEventListener('click',()=>choose(b,opt,en));box.appendChild(b);
    });
  }

  function choose(btn,opt,correct){
    if(locked)return;locked=true;sfx.tap();
    const fb=document.getElementById('feedback');
    document.querySelectorAll('.choice').forEach(c=>c.classList.add('locked'));
    if(opt===correct){
      btn.classList.add('correct');sfx.correct();
      score+=10;streak++;if(streak>bestStreak)bestStreak=streak;
      document.getElementById('scoreVal').textContent=score;
      document.getElementById('streakVal').textContent=streak;
      fb.textContent=streak>=3?pickPraise()+` x${streak}!`:pickPraise();fb.className='feedback good';
      burst('⭐');if(streak>0&&streak%5===0){burst('🎉');burst('🔥');sfx.streak();}
      setTimeout(next,650);
    }else{
      btn.classList.add('wrong');sfx.wrong();streak=0;
      document.getElementById('streakVal').textContent=0;
      // reveal the correct one
      document.querySelectorAll('.choice').forEach(c=>{if(c.textContent===correct)c.classList.add('correct');});
      fb.textContent=`الجواب : ${correct}`;fb.className='feedback bad';
      setTimeout(next,1500);
    }
  }
  function next(){qIndex++;if(qIndex>=totalQ)finish();else renderQuestion();}

  const praises=['أحسنت !','ممتاز !','رائع !','عظيم !','مثالي !','بطل !','جميل !','نعم !'];
  function pickPraise(){return praises[Math.floor(Math.random()*praises.length)];}
  function burst(emoji){const el=document.createElement('div');el.className='burst';el.textContent=emoji;
    el.style.left=(38+Math.random()*44)+'%';el.style.top='42%';document.body.appendChild(el);setTimeout(()=>el.remove(),1000);}

  function finish(){
    show('result');
    const pct=score/(totalQ*10);
    const stars=pct>=0.9?3:pct>=0.6?2:1;
    document.getElementById('resScore').textContent=`${score} نقطة · أطول سلسلة 🔥 ${bestStreak}`;
    document.getElementById('resStars').textContent='★★★'.slice(0,stars)+'☆☆☆'.slice(0,3-stars);
    let emoji,title,msg;
    if(stars===3){emoji='🏆';title='بطل !';msg='رائع ! إنجليزيتك ممتازة. واصل هكذا 💪';sfx.win();}
    else if(stars===2){emoji='🎉';title='جيد جداً !';msg='أحسنت ! قليل بعد وستصبح مثالياً.';sfx.win();}
    else{emoji='💪';title='مجهود جيد !';msg='واصل ! يمكن لأستاذ أن يساعدك على التقدّم بسرعة.';sfx.lose();}
    document.getElementById('resEmoji').textContent=emoji;
    document.getElementById('resTitle').textContent=title;
    document.getElementById('resMsg').textContent=msg;
  }

  document.getElementById('playBack').addEventListener('click',()=>show('home'));
  document.getElementById('resHome').addEventListener('click',()=>show('home'));
  document.getElementById('resAgain').addEventListener('click',()=>startTheme(currentTheme));

  show('home');
</script>
</body>
</html>
